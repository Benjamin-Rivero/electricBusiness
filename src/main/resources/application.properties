spring.application.name=businessCase
spring.datasource.url=jdbc:mariadb://localhost:3307/db_electricbusiness
spring.config.import=file:src/main/resources/external-config.properties

# Changer pour mySQL si nécessaire : com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Changer pour indiquer le comportement souhaité sur la BDD : none, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL en log
spring.jpa.show-sql=true

# Affiche les messages d'erreurs explicitement
server.error.include-message=always

# N�cessaire pour le Swagger
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER
# http://localhost:8080/swagger-ui/index.html


